<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Monza - Agrate | Scoreboard PRISM</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:transparent;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
body{display:flex;align-items:flex-start;justify-content:center;padding:8px}
.board{width:min(100%,1100px);color:#fff;user-select:none}
.top{display:grid;grid-template-columns:1fr 190px 1fr;align-items:stretch}
.team{height:92px;display:flex;align-items:center;gap:14px;padding:8px 16px;font-weight:900}
.home{background:linear-gradient(135deg,#fff,#f2f2f2);border:2px solid #d71920;border-radius:18px 0 0 18px;padding-left:10px;padding-right:18px}
.away{background:linear-gradient(135deg,#ffe119,#f5c900);border:2px solid #164a9c;border-radius:0 18px 18px 0;flex-direction:row-reverse}
.logo{height:76px;width:76px;object-fit:contain;flex:none}.home .logo{height:108px;width:108px}
.name{font-size:27px;letter-spacing:.8px;white-space:nowrap}
.home .name,.home .score{color:#d71920}
.away .name,.away .score{color:#164a9c}
.score{font-size:57px;line-height:1;margin-left:auto}
.away .score{margin-left:0;margin-right:auto}
.clockbox{background:linear-gradient(#15181c,#050608);border:2px solid #333;border-left:0;border-right:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.quarter{font-size:16px;font-weight:900;letter-spacing:1px}
.clock{font:900 40px/1 monospace;margin-top:5px}
.stats{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
.stat{background:rgba(0,0,0,.9);border-radius:0 0 12px 12px;padding:7px 14px;font-size:13px;font-weight:900;min-width:260px}
.awaystat{text-align:right}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid #aaa;margin-left:4px;vertical-align:middle}
.dot.on.homeDot{background:#d71920;border-color:#d71920}
.dot.on.awayDot{background:#164a9c;border-color:#164a9c}
.controls{margin-top:10px;background:rgba(5,7,10,.96);border:1px solid #30343b;border-radius:14px;padding:9px;display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
button{border:0;border-radius:9px;padding:9px 12px;background:#20252c;color:#fff;font-size:14px;font-weight:900}
button:active{transform:scale(.96)}
.homeBtn{border:1px solid #d71920}
.awayBtn{border:1px solid #164a9c}
.start{background:#087f3d}
.stop{background:#b51e2c}
.label{display:flex;align-items:center;font-size:12px;font-weight:900;margin:0 2px}
.homeLabel{color:#d71920} .awayLabel{color:#164a9c}
@media(max-width:700px){
 .top{grid-template-columns:1fr 112px 1fr}
 .team{height:67px;padding:5px 7px;gap:5px}
 .logo{height:54px;width:54px}.home .logo{height:70px;width:70px}
 .name{font-size:15px}
 .score{font-size:38px}
 .clock{font-size:27px}
 .quarter{font-size:10px}
 .stat{min-width:0;padding:5px 7px;font-size:8px}
 .dot{width:7px;height:7px}
 button{font-size:11px;padding:7px 8px}
}
.controls {
display: none !important;
}
</style>
</head>

 <div class="stats">
  <div class="stat">FALLI <span id="homeFouls"></span> &nbsp; | &nbsp; TIMEOUT <span id="homeTO"></span></div>
  <div class="stat awaystat">TIMEOUT <span id="awayTO"></span> &nbsp; | &nbsp; FALLI <span id="awayFouls"></span></div>
 </div>

 <div class="controls">
  <span class="label homeLabel">MONZA</span>
  <button class="homeBtn" onclick="score('h',1)">+1</button>
  <button class="homeBtn" onclick="score('h',2)">+2</button>
  <button class="homeBtn" onclick="score('h',3)">+3</button>
  <button class="homeBtn" onclick="score('h',-1)">−1</button>

  <span class="label awayLabel">AGRATE</span>
  <button class="awayBtn" onclick="score('a',1)">+1</button>
  <button class="awayBtn" onclick="score('a',2)">+2</button>
  <button class="awayBtn" onclick="score('a',3)">+3</button>
  <button class="awayBtn" onclick="score('a',-1)">−1</button>

  <button class="start" onclick="toggleTimer()">START/STOP</button>
  <button onclick="resetClock()">RESET CRONO</button>
  <button onclick="prevQuarter()">◀ QUARTO</button>
  <button onclick="nextQuarter()">QUARTO ▶</button>

  <button class="homeBtn" onclick="changeFoul('h',1)">MONZA F+</button>
  <button class="homeBtn" onclick="changeFoul('h',-1)">MONZA F−</button>
  <button class="awayBtn" onclick="changeFoul('a',1)">AGRATE F+</button>
  <button class="awayBtn" onclick="changeFoul('a',-1)">AGRATE F−</button>

  <button class="homeBtn" onclick="changeTO('h',1)">MONZA TO+</button>
  <button class="homeBtn" onclick="changeTO('h',-1)">MONZA TO−</button>
  <button class="awayBtn" onclick="changeTO('a',1)">AGRATE TO+</button>
  <button class="awayBtn" onclick="changeTO('a',-1)">AGRATE TO−</button>

  <button class="stop" onclick="resetGame()">RESET PARTITA</button>
 </div>
</div>

<script>
let state={hs:0,as:0,hf:0,af:0,hto:0,ato:0,q:1,sec:600,running:false};
let timer=null;

function dots(n,cls,max=5){
 let x=''; for(let i=0;i<max;i++) x += '<span class="dot '+cls+' '+(i<n?'on':'')+'"></span>'; return x;
}
function render(){
 document.getElementById('homeScore').textContent=String(state.hs).padStart(2,'0');
 document.getElementById('awayScore').textContent=String(state.as).padStart(2,'0');
 document.getElementById('quarter').textContent=state.q+'° QUARTO';
 let m=Math.floor(state.sec/60),s=state.sec%60;
 document.getElementById('clock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
 document.getElementById('homeFouls').innerHTML=dots(state.hf,'homeDot');
 document.getElementById('awayFouls').innerHTML=dots(state.af,'awayDot');
 document.getElementById('homeTO').innerHTML=dots(state.hto,'homeDot',5);
 document.getElementById('awayTO').innerHTML=dots(state.ato,'awayDot',5);
}
function score(t,n){
 if(t==='h') state.hs=Math.max(0,state.hs+n); else state.as=Math.max(0,state.as+n); render();
}
function changeFoul(t,n){
 if(t==='h') state.hf=Math.min(5,Math.max(0,state.hf+n)); else state.af=Math.min(5,Math.max(0,state.af+n)); render();
}
function changeTO(t,n){
 if(t==='h') state.hto=Math.min(5,Math.max(0,state.hto+n)); else state.ato=Math.min(5,Math.max(0,state.ato+n)); render();
}
function toggleTimer(){
 state.running=!state.running;
 clearInterval(timer);
 if(state.running){
  timer=setInterval(()=>{
   if(state.sec>0){state.sec--;render();}
   else{state.running=false;clearInterval(timer);render();}
  },1000);
 }
 render();
}
function resetClock(){state.running=false;clearInterval(timer);state.sec=600;render();}
function nextQuarter(){state.q=Math.min(4,state.q+1);state.running=false;clearInterval(timer);state.sec=600;render();}
function prevQuarter(){state.q=Math.max(1,state.q-1);state.running=false;clearInterval(timer);state.sec=600;render();}
function resetGame(){state={hs:0,as:0,hf:0,af:0,hto:0,ato:0,q:1,sec:600,running:false};clearInterval(timer);render();}
render();
</script>
